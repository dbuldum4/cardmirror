name: Windows desktop preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    # Scope this workflow to the user's fork, independent of repository renames.
    if: github.event.repository.id == 1400663076
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: 'npm'
      - name: Install root dependencies
        run: npm ci
      - name: Install desktop dependencies
        run: npm --prefix apps/desktop ci
      - name: Verify interim network mitigation
        run: npm run check:desktop-network
      - name: Typecheck
        run: npm run typecheck
      - name: Test desktop behavior
        run: npm test -- tests/desktop
      - name: Build renderer
        run: npm --prefix apps/desktop run build:renderer
      - name: Build services
        run: npm --prefix apps/desktop run build:service
      - name: Build native integrations
        run: npm --prefix apps/desktop run build:native
      - name: Build portable Windows executable
        working-directory: apps/desktop
        run: npx --no-install electron-builder --win portable --x64 --publish never '-c.win.artifactName=CardMirror-Advanced-Interim-${version}-${arch}.${ext}'
      - name: Include original license and notices in the download
        run: |
          Copy-Item LICENSE apps/desktop/release/LICENSE
          Copy-Item THIRD-PARTY-NOTICES.md apps/desktop/release/THIRD-PARTY-NOTICES.md
      - name: Upload portable preview
        uses: actions/upload-artifact@v4
        with:
          name: cardmirror-advanced-windows-preview
          path: |
            apps/desktop/release/CardMirror-Advanced-Interim-*.exe
            apps/desktop/release/LICENSE
            apps/desktop/release/THIRD-PARTY-NOTICES.md
          if-no-files-found: error
          retention-days: 14
