name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Typecheck + tests (${{ matrix.os }})
    # 3-OS matrix: the save/write pipeline (tests/desktop) does real
    # filesystem work — stat-based existence checks, tmp+rename atomic
    # writes, ancestor walks for the Save-As dialog — whose semantics
    # genuinely differ across ext4/APFS/NTFS, so Linux-only CI left
    # Windows behavior untested. Linux + mac run the full suite;
    # Windows starts scoped to tests/desktop (the fs-touching layer)
    # until the rest of the suite is verified clean on win32.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: windows-latest
            test-scope: tests/desktop
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install desktop dependencies
        # apps/desktop is intentionally NOT in the workspaces array
        # (electron-builder's internal install step prunes hoisted
        # dev-deps mid-build under npm workspaces — same workaround
        # as in release.yml). The root typecheck reaches into
        # apps/desktop/src via the tests/desktop test files'
        # imports, so electron's types must be present here too.
        run: npm --prefix apps/desktop ci

      - name: Verify actual pinned Electron runtime
        run: node apps/desktop/scripts/check-electron-runtime.cjs

      - name: Verify fork identity and license
        run: npm run check:fork

      - name: Audit dependencies
        if: matrix.os == 'ubuntu-latest'
        run: npm run audit:dependencies

      - uses: actions/setup-python@v5
        if: matrix.os == 'ubuntu-latest'
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'relay/requirements*.txt'
      - name: Install relay test dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install --upgrade 'pip>=26.2'
          python -m pip install -r relay/requirements-dev.txt

      - name: Relay input-boundary regressions
        if: matrix.os == 'ubuntu-latest'
        run: python3 -m unittest discover -s relay -p 'test_*.py' -v

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer and desktop entry points
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm run build
          npm --prefix apps/desktop run build:main
          npm --prefix apps/desktop run build:service

      - name: Check doc links
        # Pure-markdown check with no OS-dependent behavior, so one runner
        # is enough — the other two would just repeat it.
        if: matrix.os == 'ubuntu-latest'
        run: npm run check:links

      - name: Run tests
        # File-dependent round-trip / mark-fidelity suites discover
        # fixtures via CARDMIRROR_DOCS_DIR (default `reference-docs/
        # example docs/`). On CI there are no fixtures, so those suites
        # skip cleanly and the rest of the test surface still runs.
        env:
          # The heavy transclusion/collab fuzz suites peak past the default
          # ~4 GB V8 heap on a CI runner (they build megabyte-scale docs and
          # many Loro peers). Give the vitest fork workers more headroom.
          NODE_OPTIONS: --max-old-space-size=6144
        # An empty test-scope (linux/mac) runs the full suite.
        run: npm test -- ${{ matrix.test-scope }}
