name: macOS desktop preview

# Build the PR merge commit with read-only permissions; no release publishing,
# signing secrets, or pull_request_target execution of contributor code.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: macos-desktop-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    # The repository ID survives renames and excludes the original repository.
    if: github.event.repository.id == 1400663076
    name: macOS preview (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon
            os: macos-latest
            arch: arm64
            macho: arm64
          - label: Intel
            os: macos-15-intel
            arch: x64
            macho: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      TARGET_ARCH: ${{ matrix.arch }}
      MACHO_ARCH: ${{ matrix.macho }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json

      - name: Test dependency patch installer
        run: npm run test:dependency-patches
      - name: Install root dependencies
        run: npm ci
      - name: Install desktop dependencies
        run: npm --prefix apps/desktop ci
      - name: Verify native architecture and Koffi
        run: |
          node -e "require('node:assert/strict').equal(process.arch, process.env.TARGET_ARCH); require('./apps/desktop/node_modules/koffi'); console.log('Native architecture and Koffi verified:', process.arch);"
      - name: Verify fork identity and original license
        run: npm run check:fork
      - name: Report actual embedded runtime
        run: node apps/desktop/scripts/check-electron-runtime.cjs
      - name: Verify interim Chromium network mitigation
        run: npm run check:desktop-network
      - name: Typecheck
        run: npm run typecheck
      - name: Test desktop behavior
        run: npm test -- tests/desktop

      - name: Build renderer
        run: npm --prefix apps/desktop run build:renderer
      - name: Build services
        run: npm --prefix apps/desktop run build:service
      - name: Build native macOS integration
        run: npm --prefix apps/desktop run build:native
      - name: Package macOS DMG and ZIP
        working-directory: apps/desktop
        # Explicit architecture overrides the default universal release target.
        # Ad-hoc signing needs no Apple account or certificate secrets.
        run: |
          npx --no-install electron-builder --mac dmg zip "--$TARGET_ARCH" --publish never \
            '-c.mac.identity=-' \
            '-c.mac.artifactName=CardMirror-Advanced-Preview-${version}-${arch}.${ext}'

      - name: Verify packaged app and native architectures
        run: |
          shopt -s nullglob
          apps=(apps/desktop/release/mac*/*.app)
          [[ ${#apps[@]} -eq 1 ]]
          APP_PATH="${apps[0]}"
          export APP_PATH
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")
          lipo "$APP_PATH/Contents/MacOS/$EXECUTABLE" -verify_arch "$MACHO_ARCH"
          lipo "$APP_PATH/Contents/Resources/native/ax-suppress.dylib" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$APP_PATH"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const resources = path.join(process.env.APP_PATH, 'Contents/Resources');
          for (const [source, target] of [
            ['LICENSE', 'LICENSE.cardmirror'],
            ['THIRD-PARTY-NOTICES.md', 'THIRD-PARTY-NOTICES.md'],
          ]) {
            assert.deepEqual(fs.readFileSync(source), fs.readFileSync(path.join(resources, target)));
          }
          const asar = require('./apps/desktop/node_modules/@electron/asar');
          assert.ok(asar.listPackage(path.join(resources, 'app.asar')).includes('/dist/desktop-fetch.js'));
          assert.ok(fs.existsSync(path.join(resources, 'renderer/index.html')));
          console.log('Packaged license, notices, renderer, and Chromium transport verified.');
          NODE
          ELECTRON_RUN_AS_NODE=1 "$APP_PATH/Contents/MacOS/$EXECUTABLE" <<'NODE'
          const assert = require('node:assert/strict');
          const path = require('node:path');
          const { createRequire } = require('node:module');
          assert.equal(process.arch, process.env.TARGET_ARCH);
          assert.ok(process.versions.electron);
          const load = createRequire(path.resolve(process.env.APP_PATH, 'Contents/Resources/app.asar/package.json'));
          load('koffi');
          console.log('Packaged Electron and its native Koffi dependency load successfully.');
          NODE

      - name: Prepare download licenses and checksums
        run: |
          cp LICENSE THIRD-PARTY-NOTICES.md apps/desktop/release/
          cd apps/desktop/release
          shasum -a 256 CardMirror-Advanced-Preview-*.dmg CardMirror-Advanced-Preview-*.zip \
            LICENSE THIRD-PARTY-NOTICES.md > SHA256SUMS
      - name: Upload macOS preview
        uses: actions/upload-artifact@v4
        with:
          name: cardmirror-advanced-macos-${{ matrix.arch }}-preview
          path: |
            apps/desktop/release/CardMirror-Advanced-Preview-*.dmg
            apps/desktop/release/CardMirror-Advanced-Preview-*.zip
            apps/desktop/release/LICENSE
            apps/desktop/release/THIRD-PARTY-NOTICES.md
            apps/desktop/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
